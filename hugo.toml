baseURL = "https://shenchen1.github.io/"
languageCode = "zh-cn"
title = "ShenChen"
theme = "PaperMod"

[params]
  defaultTheme = "auto"

  # 技术文章阅读
  ShowToc = true
  TocOpen = true
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true

  # 首页展示的内容区块
  mainSections = ["posts", "notes", "projects"]

  # 归档页面包含所有文章
  ShowAllPagesInArchive = true

  # 首页不要把第一篇文章做成特殊大卡片
  disableSpecial1stPost = true

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  name = "Notes"
  url = "/notes/"
  weight = 20

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 30

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 40

[[menu.main]]
  name = "Archive"
  url = "/archives/"
  weight = 50

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 60

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    tabWidth = 4
